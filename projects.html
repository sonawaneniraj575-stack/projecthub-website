<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects | ProjectHub</title><meta name="description" content="Browse websites, full-stack, management, e-commerce, AI and dashboard projects for students."><link rel="canonical" href="https://projecthub.studio/projects.html"><meta property="og:title" content="Projects | ProjectHub"><meta property="og:description" content="Browse practical software projects and discuss your requirements."><meta property="og:image" content="assets/social-preview.svg"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="css/style.css"></head><body data-page="projects"><div id="site-header"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">Project catalogue</span><h1>Find a project to build on.</h1><p>Compare practical software projects by category, technology and scope. Every project can be discussed before you decide.</p></div></section><section class="section"><div class="container"><div class="filters" id="filters"></div><div class="cards" id="project-grid"></div></div></section></main><div id="site-footer"></div><script src="js/config.js"></script><script src="js/projects.js"></script><script src="js/main.js"></script><script>const categories=["All","Full Stack","Mini Projects","AI & ML","Management","Websites","Campus Tools","Finance","Education"],filters=document.querySelector("#filters"),grid=document.querySelector("#project-grid");function card(p){return ProjectHub.cardMarkup(p)}function show(category="All"){const matches=PROJECTS.filter(p=>{if(category==="All")return true;if(category==="Full Stack")return p.type==="Full Stack";if(category==="Mini Projects")return p.type==="Mini Project";if(category==="AI & ML")return p.category.includes("AI")||p.category.includes("Machine Learning");return p.category===category||p.type===category});grid.innerHTML=matches.map(card).join("")||'<div class="empty">No projects found in this category.</div>';document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.dataset.category===category))}filters.innerHTML=categories.map(c=>`<button class="filter ${c==="All"?"active":""}" data-category="${c}">${c}</button>`).join("");filters.addEventListener("click",e=>{if(e.target.matches(".filter"))show(e.target.dataset.category)});show();</script></body></html>
