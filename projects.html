<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects | ProjectHub</title><meta name="description" content="Browse websites, full-stack, management, e-commerce, AI and dashboard projects for students."><link rel="canonical" href="https://YOUR-DOMAIN.com/projects.html"><meta property="og:title" content="Projects | ProjectHub"><meta property="og:description" content="Browse practical software projects and discuss your requirements."><meta property="og:image" content="assets/social-preview.svg"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="css/style.css"></head><body data-page="projects"><div id="site-header"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">Project catalogue</span><h1>Find a project to build on.</h1><p>Compare practical software projects by category, technology and scope. Every project can be discussed before you decide.</p></div></section><section class="section"><div class="container"><div class="filters" id="filters"></div><div class="cards" id="project-grid"></div></div></section></main><div id="site-footer"></div><script src="js/config.js"></script><script src="js/projects.js"></script><script src="js/main.js"></script><script>const categories=["All","Websites","Full Stack","Management","E-Commerce","AI","Dashboards","Custom"],filters=document.querySelector("#filters"),grid=document.querySelector("#project-grid");function card(p){return `<article class="project-card"><img class="project-image" src="${p.image}" alt="${p.name} interface preview" loading="lazy"><div class="card-content"><div class="card-top"><h3>${p.name}</h3>${p.featured?'<span class="badge">Featured</span>':""}</div><p>${p.description}</p><div class="tags"><span class="tag">${p.category}</span><span class="tag">${p.type}</span>${p.technologies.slice(0,2).map(t=>`<span class="tag">${t}</span>`).join("")}</div><div class="card-footer"><strong class="price ${p.price?"":"custom"}">${ProjectHub.formatPrice(p.price)}</strong><a href="project.html?id=${p.id}">View Details →</a></div></div></article>`}function show(category="All"){grid.innerHTML=PROJECTS.filter(p=>category==="All"||p.category===category||p.type===category).map(card).join("")||'<div class="empty">No projects in this category yet.</div>';document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.dataset.category===category))}filters.innerHTML=categories.map(c=>`<button class="filter ${c==="All"?"active":""}" data-category="${c}">${c}</button>`).join("");filters.addEventListener("click",e=>{if(e.target.matches(".filter"))show(e.target.dataset.category)});show();</script></body></html>
