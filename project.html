<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project details | ProjectHub</title><meta name="description" content="Explore ProjectHub project details, features, technologies and what is included."><link rel="canonical" href="https://YOUR-DOMAIN.com/project.html"><meta property="og:title" content="Project details | ProjectHub"><meta property="og:description" content="Explore project features, technologies and next steps."><meta property="og:image" content="assets/social-preview.svg"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="css/style.css"></head><body data-page="projects"><div id="site-header"></div><main id="project-detail"></main><div id="site-footer"></div><script src="js/config.js"></script><script src="js/projects.js"></script><script src="js/main.js"></script><script>const id=new URLSearchParams(location.search).get("id"),p=PROJECTS.find(x=>x.id===id),root=document.querySelector("#project-detail");if(!p){root.innerHTML='<section class="section"><div class="container empty"><h1>Project not found</h1><p>The project may have been removed or the link is incorrect.</p><a class="button button-primary" href="projects.html">Explore Projects</a></div></section>'}else{document.title=`${p.name} | ProjectHub`;document.querySelector('meta[name="description"]').content=p.description;root.innerHTML=`<section class="page-hero"><div class="container"><span class="eyebrow">${p.category} · ${p.type}</span><h1>${p.name}</h1><p>${p.description}</p></div></section><section class="section"><div class="container detail-grid"><div><img class="detail-image" src="${p.image}" alt="${p.name} software interface preview"></div><div class="detail"><span class="tag">${p.type}</span><h1>${p.name}</h1><p class="section-intro">${p.description}</p><div class="price">${ProjectHub.formatPrice(p.price)}</div><div class="button-row"><a class="button button-primary" id="get-project" href="#">Get Project on WhatsApp</a><a class="button button-outline" href="contact.html">Ask a question</a></div><h2>What it includes</h2><ul class="check-list">${p.included.map(x=>`<li>${x}</li>`).join("")}</ul></div></div></section><section class="section"><div class="container detail-grid"><div><span class="eyebrow">Built with</span><h2>Technologies</h2><div class="tags">${p.technologies.map(t=>`<span class="tag">${t}</span>`).join("")}</div></div><div><span class="eyebrow">Inside the project</span><h2>Features</h2><ul class="check-list">${p.features.map(x=>`<li>${x}</li>`).join("")}</ul></div></div></section><section class="section"><div class="container faq-list"><span class="eyebrow">Project questions</span><h2>Before you get started</h2>${p.faq.map(x=>`<details class="faq-item"><summary>${x.question}</summary><p>${x.answer}</p></details>`).join("")}</div></section>`;const get=document.querySelector("#get-project");get.href=ProjectHub.waUrl(ProjectHub.projectMessage(p));get.target="_blank";get.rel="noreferrer";const ld={"@context":"https://schema.org","@type":"Product",name:p.name,description:p.description,image:new URL(p.image,location.href).href,offers:p.price?{"@type":"Offer",price:p.price,priceCurrency:"INR"}:undefined};const script=document.createElement("script");script.type="application/ld+json";script.textContent=JSON.stringify(ld);document.head.appendChild(script)}</script></body></html>
